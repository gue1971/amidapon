<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <title>あみだポン！</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #38bdf8;
            --text-color: #f8fafc;
            --highlight-color: #fbbf24;
            --danger-color: #f43f5e;
            --success-color: #4ade80;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px 0;
            touch-action: none;
            overflow: hidden;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--primary-color);
            letter-spacing: 2px;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .header-btn {
            background: none;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .header-btn:active { background-color: #334155; }
        #btn-retry-same {
            border-color: var(--highlight-color);
            color: var(--highlight-color);
        }

        #app-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 78vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
            background-color: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .starts-container {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            height: 40px;
            pointer-events: none;
            z-index: 10;
        }
        .start-btn {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: var(--bg-color);
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transform: translateX(-50%);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s, color 0.2s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .start-btn:active { transform: translateX(-50%) scale(0.9); }
        .start-btn.disabled {
            background-color: #475569;
            color: #94a3b8;
            pointer-events: none;
            box-shadow: none;
        }
        .start-btn.selected {
            background-color: var(--highlight-color);
            color: #78350f;
            pointer-events: none;
            transform: translateX(-50%) scale(1.1);
        }

        .results-container {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 130px;
            pointer-events: none;
            z-index: 10;
        }
        .result-item {
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            transform: translateX(-50%);
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer; 
        }
        .result-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }
        .result-icon:active { transform: scale(0.8); }
        .result-input {
            width: 30px;
            height: 90px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 5px 2px;
            border-radius: 6px;
            border: 2px solid #475569;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Yu Mincho', 'MS Mincho', 'Hiragino Mincho ProN', serif;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .result-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
        .result-input:disabled {
            border-color: transparent;
            background-color: #334155;
            color: #cbd5e1;
            opacity: 1;
            pointer-events: none; 
        }
        
        @keyframes pop {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); z-index: 50; }
            100% { transform: translateX(-50%) scale(1); }
        }
        .highlight-pop {
            animation: pop 0.6s ease-out;
        }

        @keyframes shock {
            0% { transform: translateX(-50%) translate(0, 0); }
            10% { transform: translateX(-50%) translate(-4px, -4px) rotate(-5deg); filter: drop-shadow(0 0 20px rgba(244,63,94,0.8)); z-index: 50; }
            20% { transform: translateX(-50%) translate(4px, 4px) rotate(5deg); }
            30% { transform: translateX(-50%) translate(-4px, 4px) rotate(-5deg); }
            40% { transform: translateX(-50%) translate(4px, -4px) rotate(5deg); }
            50% { transform: translateX(-50%) translate(-4px, -4px) rotate(-5deg); }
            60% { transform: translateX(-50%) translate(4px, 4px) rotate(5deg); }
            70% { transform: translateX(-50%) translate(-4px, 4px) rotate(-5deg); }
            80% { transform: translateX(-50%) translate(4px, -4px) rotate(5deg); }
            90% { transform: translateX(-50%) translate(-2px, -2px) rotate(-2deg); }
            100% { transform: translateX(-50%) translate(0, 0) rotate(0); }
        }
        .highlight-shock {
            animation: shock 0.6s ease-in-out;
        }

        /* シャッフルボタンの震えるアニメーション */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-2deg); }
            75% { transform: translateX(3px) rotate(2deg); }
        }
        .shaking {
            animation: shake 0.1s infinite;
            background-color: #475569 !important;
            color: #cbd5e1 !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        #center-mask {
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            transform: translateY(-50%);
            background-color: rgba(15, 23, 42, 0.85);
            border-radius: 12px;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 30px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            transition: opacity 0.4s ease, background-color 0.4s ease, backdrop-filter 0.4s ease;
        }
        .mask-title {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        .setup-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .setup-btn {
            background-color: #475569;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
        }
        .count-display {
            font-size: 2rem;
            font-weight: bold;
            width: 40px;
            text-align: center;
        }
        .action-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--primary-color);
            color: var(--bg-color);
            transition: transform 0.1s, opacity 0.3s;
            box-shadow: 0 4px 10px rgba(56,189,248,0.3);
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.danger { background-color: var(--danger-color); color: white; box-shadow: 0 4px 10px rgba(244,63,94,0.3); }
        .action-btn:disabled { opacity: 0; pointer-events: none; }
        
        .instruction-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.5;
        }
        .current-player {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--highlight-color);
            margin-bottom: 20px;
        }
        .countdown-text {
            font-size: 6rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            animation: pulse 1s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        .ui-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 160px; /* 全てのフェーズで外枠の高さを統一 */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>あみだポン！</h1>
        <div class="header-buttons">
            <button class="header-btn" id="btn-retry-same" style="display:none;">もう一度</button>
            <button class="header-btn" id="btn-reset-top">リセット</button>
        </div>
    </div>

    <div id="app-container">
        <svg id="amida-svg" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <g id="lines-group"></g>
            <g id="path-group"></g>
            <circle id="tracer" r="6" fill="#fff" style="display: none; filter: drop-shadow(0 0 8px #fff);" />
        </svg>

        <div id="center-mask">
            <!-- 1. 線の数 -->
            <div id="setup-lines-ui" class="ui-panel">
                <div class="mask-title">人数（くじの数）</div>
                <div class="setup-controls">
                    <button class="setup-btn" id="btn-minus-lines">-</button>
                    <div class="count-display" id="line-count">4</div>
                    <button class="setup-btn" id="btn-plus-lines">+</button>
                </div>
                <button class="action-btn" id="btn-next-lines">次へ</button>
            </div>

            <!-- 2. 内容設定 (NEW) -->
            <div id="setup-content-ui" class="ui-panel">
                <div class="mask-title">結果を設定してね</div>
                <div class="instruction-text">
                    下枠タップで内容変更
                </div>
                <button class="action-btn" id="btn-next-content" style="margin-top: 15px;">次へ</button>
            </div>

            <!-- 3. くじ選択 -->
            <div id="select-ui" class="ui-panel">
                <div class="mask-title">くじを選んでください</div>
                <div class="current-player" id="current-player-label">Aさん</div>
                <div class="instruction-text">
                    上の丸いボタンをタップしてね
                </div>
            </div>

            <!-- 3. シャッフル -->
            <div id="shuffle-ui" class="ui-panel">
                <button class="action-btn" id="btn-shuffle">シャッフル</button>
                <button class="action-btn" id="btn-start-game" style="display: none;">スタート</button>
            </div>

            <!-- 5. カウントダウン -->
            <div id="countdown-ui" class="ui-panel">
                <div class="countdown-text" id="countdown-display">3</div>
            </div>
        </div>

        <div class="starts-container" id="starts"></div>
        <div class="results-container" id="results"></div>
    </div>

    <script>
        // --- サウンドマネージャー（Web Audio APIによるレトロSE合成） ---
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            initCtx() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(type, freq, freqEnd, duration, vol) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (freqEnd) {
                    osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            
            click() { this.initCtx(); this.playTone('triangle', 800, 200, 0.05, 0.1); }
            toggle() { this.initCtx(); this.playTone('sine', 300, 500, 0.1, 0.1); }
            select() { this.initCtx(); this.playTone('square', 500, 800, 0.1, 0.05); }
            shuffle() { this.initCtx(); this.playTone('sawtooth', 200, null, 0.02, 0.05); }
            countdown() { this.initCtx(); this.playTone('square', 440, null, 0.1, 0.05); }
            start() { this.initCtx(); this.playTone('square', 880, null, 0.4, 0.05); }
            moveTick() { this.initCtx(); this.playTone('sine', 600, 400, 0.03, 0.02); }
            corner() { this.initCtx(); this.playTone('triangle', 1200, 800, 0.05, 0.05); }
            
            atari() {
                this.initCtx();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, C(High)
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    const t = this.ctx.currentTime + i * 0.08;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(t); osc.stop(t + 0.4);
                });
            }
            
            dobon() {
                this.initCtx();
                [150, 160, 175].forEach(freq => { // 不協和音
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq / 1.5, this.ctx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.6);
                });
            }
            
            hazure() {
                this.initCtx();
                this.playTone('triangle', 300, 100, 0.3, 0.1);
            }
        }
        const sound = new SoundManager();

        // --- メインロジック ---
        const svgns = "http://www.w3.org/2000/svg";
        const playerNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        
        const TYPES = {
            ATARI:  { icon: '⭐', defaultText: 'あたり', color: '#fbbf24' },
            DOBON:  { icon: '💀', defaultText: 'ドボン', color: '#f43f5e' },
            HAZURE: { icon: '・', defaultText: 'はずれ', color: '#94a3b8' }
        };
        const TYPE_KEYS = ['ATARI', 'HAZURE', 'DOBON'];

        let state = 'SETUP_LINES'; 
        let lineCount = 4;
        let currentPlayerIndex = 0;
        let selections = []; 
        let rungs = [];
        let itemsData = []; 
        let drawnPaths = {}; 

        // 非同期処理キャンセル用の管理変数
        let currentRunId = 0;
        let shuffleTimeoutId = null;
        let countdownIntervalId = null;

        const VIEW_WIDTH = 300;
        const VIEW_HEIGHT = 600;
        const PADDING_TOP = 60;
        const PADDING_BOTTOM = 140; 
        const PADDING_SIDE = 30;

        const ui = {
            linesGroup: document.getElementById('lines-group'),
            pathGroup: document.getElementById('path-group'),
            tracer: document.getElementById('tracer'),
            starts: document.getElementById('starts'),
            results: document.getElementById('results'),
            mask: document.getElementById('center-mask'),
            panels: {
                lines: document.getElementById('setup-lines-ui'),
                content: document.getElementById('setup-content-ui'),
                select: document.getElementById('select-ui'),
                shuffle: document.getElementById('shuffle-ui'),
                countdown: document.getElementById('countdown-ui')
            },
            lineCount: document.getElementById('line-count'),
            playerLabel: document.getElementById('current-player-label'),
            btnShuffle: document.getElementById('btn-shuffle'),
            btnStartGame: document.getElementById('btn-start-game'),
            countdown: document.getElementById('countdown-display'),
            btnRetrySame: document.getElementById('btn-retry-same')
        };

        function switchUI(panelName) {
            Object.values(ui.panels).forEach(p => p.style.display = 'none');
            if (ui.panels[panelName]) ui.panels[panelName].style.display = 'flex';
        }

        function getLeftPercent(colIndex) {
            const lineSpacing = (VIEW_WIDTH - PADDING_SIDE * 2) / (lineCount - 1);
            return (PADDING_SIDE + colIndex * lineSpacing) / VIEW_WIDTH * 100;
        }

        function init(fullReset = true) {
            currentRunId++;
            clearTimeout(shuffleTimeoutId);
            clearInterval(countdownIntervalId);

            sound.initCtx(); 
            // fullReset=false（もう一度）の場合は、人数・内容は引き継いで「くじ選択」から
            state = fullReset ? 'SETUP_LINES' : 'SELECTING';
            if (fullReset) lineCount = 4;
            
            currentPlayerIndex = 0;
            selections = [];
            drawnPaths = {};
            ui.pathGroup.innerHTML = '';
            ui.tracer.style.display = 'none';
            ui.mask.style.opacity = '1';
            ui.mask.style.pointerEvents = 'auto';
            ui.mask.style.display = 'flex';
            ui.mask.style.backgroundColor = 'rgba(15, 23, 42, 0.85)';
            ui.mask.style.backdropFilter = 'blur(6px)';
            ui.btnRetrySame.style.display = 'none';
            
            ui.btnShuffle.classList.remove('shaking');
            ui.btnShuffle.disabled = false;
            
            ui.linesGroup.innerHTML = '';
            ui.starts.innerHTML = '';
            if(fullReset) ui.results.innerHTML = '';

            generateRungs();
            drawLines();
            
            if (fullReset) {
                initItemsData();
                renderResults();
                switchUI('lines');
                ui.lineCount.innerText = lineCount;
                // 最初は下枠変更不可
                document.querySelectorAll('.result-input').forEach(input => input.disabled = true);
            } else {
                renderResults(); 
                ui.starts.childNodes.forEach(btn => {
                    btn.classList.remove('selected', 'disabled');
                    btn.innerText = parseInt(btn.dataset.col) + 1;
                    btn.style.backgroundColor = '';
                    btn.style.boxShadow = '';
                });
                // 再プレイ時は下枠変更不可
                document.querySelectorAll('.result-input').forEach(input => input.disabled = true);
                switchUI('select');
                updateSelectionUI();
            }
            renderStarts();
        }

        function generateRungs() {
            rungs = [];
            const startY = PADDING_TOP + 20;
            const endY = VIEW_HEIGHT - PADDING_BOTTOM - 20;
            const availableHeight = endY - startY;

            for (let i = 0; i < lineCount - 1; i++) {
                const numRungs = Math.floor(Math.random() * 4) + 3;
                const step = availableHeight / numRungs;
                for (let j = 0; j < numRungs; j++) {
                    const y = startY + (j * step) + Math.random() * (step * 0.6) + (step * 0.2);
                    rungs.push({ col: i, y: y });
                }
            }
            
            rungs.sort((a, b) => a.y - b.y);
            
            for (let i = 1; i < rungs.length; i++) {
                if (rungs[i].y - rungs[i-1].y < 4) rungs[i].y = rungs[i-1].y + 4;
            }

            const maxY = VIEW_HEIGHT - PADDING_BOTTOM - 10;
            const lastY = rungs[rungs.length - 1].y;
            if (lastY > maxY) {
                const scale = (maxY - startY) / (lastY - startY);
                rungs.forEach(rung => { rung.y = startY + (rung.y - startY) * scale; });
            }
        }

        function drawLines() {
            const lineSpacing = (VIEW_WIDTH - PADDING_SIDE * 2) / (lineCount - 1);
            for (let i = 0; i < lineCount; i++) {
                const x = PADDING_SIDE + i * lineSpacing;
                const line = document.createElementNS(svgns, 'line');
                line.setAttribute('x1', x); line.setAttribute('y1', PADDING_TOP);
                line.setAttribute('x2', x); line.setAttribute('y2', VIEW_HEIGHT - PADDING_BOTTOM);
                line.setAttribute('stroke', '#475569'); line.setAttribute('stroke-width', '3');
                ui.linesGroup.appendChild(line);
            }
            rungs.forEach(rung => {
                const x1 = PADDING_SIDE + rung.col * lineSpacing;
                const x2 = x1 + lineSpacing;
                const line = document.createElementNS(svgns, 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', rung.y);
                line.setAttribute('x2', x2); line.setAttribute('y2', rung.y);
                line.setAttribute('stroke', '#475569'); line.setAttribute('stroke-width', '3');
                ui.linesGroup.appendChild(line);
            });
        }

        function renderStarts() {
            ui.starts.innerHTML = '';
            for (let i = 0; i < lineCount; i++) {
                const btn = document.createElement('div');
                // 内容設定フェーズまではdisabled
                btn.className = (state === 'SETUP_LINES' || state === 'SETUP_CONTENT') ? 'start-btn disabled' : 'start-btn';
                btn.innerText = i + 1;
                btn.style.left = `${getLeftPercent(i)}%`;
                btn.dataset.col = i;
                btn.onclick = () => handleLineSelection(i, btn);
                ui.starts.appendChild(btn);
            }
        }

        function initItemsData() {
            itemsData = [];
            for (let i = 0; i < lineCount; i++) {
                let type = 'HAZURE';
                if (i === 0) type = 'ATARI';
                else if (i === lineCount - 1 && lineCount > 2) type = 'DOBON';

                itemsData.push({
                    id: `res-${i}`,
                    typeKey: type,
                    text: TYPES[type].defaultText,
                    colIndex: i
                });
            }
        }

        function renderResults() {
            ui.results.innerHTML = '';
            itemsData.forEach(item => {
                const dom = document.createElement('div');
                dom.className = 'result-item';
                dom.id = item.id;
                dom.style.left = `${getLeftPercent(item.colIndex)}%`;

                const icon = document.createElement('div');
                icon.className = 'result-icon';
                icon.innerText = TYPES[item.typeKey].icon;
                
                icon.onclick = (e) => {
                    // 内容変更フェーズのみ変更可能
                    if (state === 'SETUP_CONTENT') {
                        toggleType(item.id);
                        e.stopPropagation(); 
                    }
                };

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'result-input';
                input.value = item.text;
                // 内容変更フェーズのみテキスト変更可能
                input.disabled = (state !== 'SETUP_CONTENT');
                input.oninput = (e) => item.text = e.target.value;
                input.onfocus = (e) => e.target.select();
                
                dom.onclick = () => {
                    if (state === 'FINISHED') {
                        highlightPathByResult(item.colIndex);
                    }
                };

                dom.appendChild(icon);
                dom.appendChild(input);
                ui.results.appendChild(dom);
            });
        }

        function toggleType(id) {
            if (state !== 'SETUP_CONTENT') return;
            sound.toggle();
            const item = itemsData.find(d => d.id === id);
            let idx = TYPE_KEYS.indexOf(item.typeKey);
            idx = (idx + 1) % TYPE_KEYS.length;
            item.typeKey = TYPE_KEYS[idx];
            item.text = TYPES[item.typeKey].defaultText;
            renderResults(); 
        }

        function updateBoard() {
            ui.linesGroup.innerHTML = '';
            ui.starts.innerHTML = '';
            ui.results.innerHTML = '';
            generateRungs();
            drawLines();
            initItemsData();
            renderResults();
            renderStarts();
            ui.lineCount.innerText = lineCount;
        }

        // --- フェーズ進行 ---

        // 1. 線の数設定
        document.getElementById('btn-minus-lines').onclick = () => {
            sound.click();
            if (lineCount > 2) { lineCount--; updateBoard(); }
        };
        document.getElementById('btn-plus-lines').onclick = () => {
            sound.click();
            if (lineCount < 8) { lineCount++; updateBoard(); }
        };
        document.getElementById('btn-next-lines').onclick = () => {
            sound.click();
            state = 'SETUP_CONTENT';
            switchUI('content');
            // 下枠の内容変更を許可
            document.querySelectorAll('.result-input').forEach(b => b.disabled = false);
        };

        // 2. 内容設定
        document.getElementById('btn-next-content').onclick = () => {
            sound.click();
            state = 'SELECTING';
            switchUI('select');
            // 下枠の内容変更をロックし、上のくじボタンを有効化
            document.querySelectorAll('.result-input').forEach(b => b.disabled = true);
            document.querySelectorAll('.start-btn').forEach(b => b.classList.remove('disabled'));
            updateSelectionUI();
        };

        function getPlayerColor(index) {
            const colors = ['#38bdf8', '#a3e635', '#f472b6', '#c084fc', '#4ade80', '#fb923c', '#e2e8f0', '#fbbf24'];
            return colors[index % colors.length];
        }

        function updateSelectionUI() {
            ui.playerLabel.innerText = `${playerNames[currentPlayerIndex]}さん`;
            ui.playerLabel.style.color = getPlayerColor(currentPlayerIndex);
        }

        // 3. くじ選択
        function handleLineSelection(lineIndex, btn) {
            if (state !== 'SELECTING' || btn.classList.contains('selected')) return;

            sound.select();
            selections.push({ playerIndex: currentPlayerIndex, lineIndex: lineIndex });
            btn.classList.add('selected');
            btn.innerText = playerNames[currentPlayerIndex];
            btn.style.backgroundColor = getPlayerColor(currentPlayerIndex);
            btn.style.boxShadow = `0 0 15px ${getPlayerColor(currentPlayerIndex)}80`;

            currentPlayerIndex++;
            if (currentPlayerIndex >= lineCount) {
                state = 'SHUFFLING';
                switchUI('shuffle');
                ui.btnShuffle.style.display = 'block';
                ui.btnStartGame.style.display = 'none';
            } else {
                updateSelectionUI();
            }
        }

        // --- シャッフルタイマー制御 ---
        ui.btnShuffle.onclick = startShuffle;

        function startShuffle() {
            const runId = currentRunId;
            sound.click();
            ui.btnShuffle.disabled = true;
            ui.btnShuffle.classList.add('shaking');
            
            let duration = 5000;
            const startTime = performance.now();
            let currentDelay = 400;

            function doSwap() {
                sound.shuffle();
                let idx1 = Math.floor(Math.random() * lineCount);
                let idx2 = Math.floor(Math.random() * lineCount);
                while (idx1 === idx2) idx2 = Math.floor(Math.random() * lineCount);

                const tempCol = itemsData[idx1].colIndex;
                itemsData[idx1].colIndex = itemsData[idx2].colIndex;
                itemsData[idx2].colIndex = tempCol;

                const dom1 = document.getElementById(itemsData[idx1].id);
                const dom2 = document.getElementById(itemsData[idx2].id);
                if(dom1 && dom2) {
                    dom1.style.left = `${getLeftPercent(itemsData[idx1].colIndex)}%`;
                    dom2.style.left = `${getLeftPercent(itemsData[idx2].colIndex)}%`;
                }
            }

            function loop() {
                if (runId !== currentRunId) return;
                doSwap();
                
                const elapsed = performance.now() - startTime;
                
                if (elapsed < 2500) {
                    currentDelay = Math.max(50, currentDelay * 0.8); 
                } else if (elapsed < 3500) {
                    currentDelay = 50;  
                } else {
                    currentDelay = 600; 
                }

                if (elapsed + currentDelay < duration) {
                    shuffleTimeoutId = setTimeout(loop, currentDelay);
                } else {
                    shuffleTimeoutId = setTimeout(() => stopShuffle(runId), Math.max(0, duration - elapsed));
                }
            }
            loop();
        }

        function stopShuffle(runId) {
            if (runId !== currentRunId) return;
            ui.btnShuffle.classList.remove('shaking');
            ui.btnShuffle.disabled = false;
            ui.btnShuffle.style.display = 'none';

            itemsData.forEach(item => {
                if (item.typeKey === 'ATARI' || item.typeKey === 'DOBON') {
                    const dom = document.getElementById(item.id);
                    if(dom) {
                        dom.classList.add('highlight-pop');
                        setTimeout(() => { if (runId === currentRunId) dom.classList.remove('highlight-pop'); }, 600);
                    }
                }
            });

            ui.btnStartGame.style.display = 'block';
            ui.btnStartGame.onclick = () => {
                if (runId !== currentRunId) return;
                sound.click();
                state = 'COUNTDOWN';
                switchUI('countdown');
                startCountdown(runId);
            };
        }

        function startCountdown(runId) {
            if (!runId) runId = currentRunId;

            let count = 3;
            ui.countdown.innerText = count;
            sound.countdown();

            countdownIntervalId = setInterval(() => {
                if (runId !== currentRunId) {
                    clearInterval(countdownIntervalId);
                    return;
                }
                count--;
                if (count > 0) {
                    sound.countdown();
                    ui.countdown.innerText = count;
                    ui.countdown.style.animation = 'none';
                    ui.countdown.offsetHeight; 
                    ui.countdown.style.animation = null; 
                } else {
                    sound.start();
                    clearInterval(countdownIntervalId);
                    startPlayingPhase(runId);
                }
            }, 1000);
        }

        function startPlayingPhase(runId) {
            state = 'PLAYING';
            ui.mask.style.opacity = '0';
            setTimeout(() => {
                if (runId !== currentRunId) return;
                ui.mask.style.display = 'none';
                ui.mask.style.pointerEvents = 'none';
                runAllAnimations(runId);
            }, 400);
        }

        async function runAllAnimations(runId) {
            for (let i = 0; i < lineCount; i++) {
                if (runId !== currentRunId) return;
                const selection = selections.find(s => s.playerIndex === i);
                if (selection) {
                    await animatePathSegmented(selection.lineIndex, selection.playerIndex, runId);
                    if (runId !== currentRunId) return;
                    await new Promise(r => setTimeout(r, 400));
                }
            }
            if (runId !== currentRunId) return;
            state = 'FINISHED';
            ui.btnRetrySame.style.display = 'block';
            
            ui.starts.childNodes.forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.onclick = () => highlightPathByStart(parseInt(btn.dataset.col));
            });
        }

        function getPathCoords(startIndex) {
            const lineSpacing = (VIEW_WIDTH - PADDING_SIDE * 2) / (lineCount - 1);
            let col = startIndex;
            let y = PADDING_TOP;
            const coords = [{ x: PADDING_SIDE + col * lineSpacing, y: y }];

            for (let i = 0; i < rungs.length; i++) {
                const rung = rungs[i];
                if (rung.y > y) {
                    if (rung.col === col) {
                        y = rung.y;
                        coords.push({ x: PADDING_SIDE + col * lineSpacing, y: y });
                        col++;
                        coords.push({ x: PADDING_SIDE + col * lineSpacing, y: y });
                    } else if (rung.col === col - 1) {
                        y = rung.y;
                        coords.push({ x: PADDING_SIDE + col * lineSpacing, y: y });
                        col--;
                        coords.push({ x: PADDING_SIDE + col * lineSpacing, y: y });
                    }
                }
            }
            coords.push({ x: PADDING_SIDE + col * lineSpacing, y: VIEW_HEIGHT - PADDING_BOTTOM });
            return { coords, finalCol: col };
        }

        async function animatePathSegmented(startIndex, playerIndex, runId) {
            const { coords, finalCol } = getPathCoords(startIndex);
            const color = getPlayerColor(playerIndex);
            
            const path = document.createElementNS(svgns, 'path');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', '5');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            path.dataset.player = playerIndex;
            path.dataset.startCol = startIndex;
            path.dataset.finalCol = finalCol;
            ui.pathGroup.appendChild(path);
            drawnPaths[playerIndex] = path;

            let d = `M ${coords[0].x} ${coords[0].y}`;
            path.setAttribute('d', d);

            ui.tracer.style.display = 'block';
            ui.tracer.setAttribute('fill', color);
            ui.tracer.style.filter = `drop-shadow(0 0 6px ${color})`;

            for (let i = 0; i < coords.length - 1; i++) {
                if (runId !== currentRunId) return;
                const start = coords[i];
                const end = coords[i+1];
                const dist = Math.hypot(end.x - start.x, end.y - start.y);
                const duration = dist * 2; 

                sound.moveTick();

                await new Promise(resolve => {
                    const st = performance.now();
                    function step(now) {
                        if (runId !== currentRunId) return resolve();
                        const elapsed = now - st;
                        const p = Math.min(elapsed / duration, 1);
                        const cx = start.x + (end.x - start.x) * p;
                        const cy = start.y + (end.y - start.y) * p;

                        path.setAttribute('d', d + ` L ${cx} ${cy}`);
                        ui.tracer.setAttribute('cx', cx);
                        ui.tracer.setAttribute('cy', cy);

                        if (p < 1) requestAnimationFrame(step);
                        else {
                            d += ` L ${end.x} ${end.y}`; 
                            resolve();
                        }
                    }
                    requestAnimationFrame(step);
                });

                if (runId !== currentRunId) return;

                if (i < coords.length - 2) {
                    sound.corner(); 
                    await new Promise(r => setTimeout(r, 80));
                }
            }

            if (runId !== currentRunId) return;

            ui.tracer.style.display = 'none';
            
            const finalItem = itemsData.find(d => d.colIndex === finalCol);
            const resDom = document.getElementById(finalItem.id);
            const resInput = resDom.querySelector('.result-input');
            resInput.style.borderColor = color;
            resInput.style.boxShadow = `0 0 10px ${color}80`;

            if (finalItem.typeKey === 'ATARI') {
                sound.atari();
                resDom.classList.add('highlight-pop');
                await new Promise(r => setTimeout(r, 600)); 
                if (runId === currentRunId) resDom.classList.remove('highlight-pop');
            } else if (finalItem.typeKey === 'DOBON') {
                sound.dobon();
                resDom.classList.add('highlight-shock');
                await new Promise(r => setTimeout(r, 600)); 
                if (runId === currentRunId) resDom.classList.remove('highlight-shock');
            } else {
                sound.hazure();
                await new Promise(r => setTimeout(r, 300));
            }
        }

        function highlightPath(targetPath) {
            sound.click();
            Object.values(drawnPaths).forEach(p => {
                p.setAttribute('opacity', '0.2');
                p.setAttribute('stroke-width', '3');
            });
            targetPath.setAttribute('opacity', '1');
            targetPath.setAttribute('stroke-width', '7');
            ui.pathGroup.appendChild(targetPath); 
        }

        function highlightPathByStart(colIndex) {
            const path = Object.values(drawnPaths).find(p => parseInt(p.dataset.startCol) === colIndex);
            if (path) highlightPath(path);
        }

        function highlightPathByResult(colIndex) {
            const path = Object.values(drawnPaths).find(p => parseInt(p.dataset.finalCol) === colIndex);
            if (path) highlightPath(path);
        }

        document.getElementById('btn-reset-top').onclick = () => { sound.click(); init(true); };
        document.getElementById('btn-retry-same').onclick = () => { sound.click(); init(false); };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }

        init(true);

    </script>
</body>
</html>
